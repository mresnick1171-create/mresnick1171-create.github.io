<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michael Resnick's 3D Print Gallery</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:60px 20px;
    background:#181818;
}

h1{
    font-size:3rem;
    margin:0;
}

.tagline{
    color:#4da3ff;
    margin-top:10px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:#1e1e1e;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3{
    padding:15px;
    margin:0;
}

footer{
    text-align:center;
    padding:30px;
    background:#181818;
    color:#999;
}
</style>
</head>

<body>

<header>
<h1>Michael Resnick's 3D Print Gallery</h1>
<p class="tagline">Bringing Ideas to Life Through 3D Printing</p>
</header>

<section class="gallery">

<div class="card">
<img src="https://picsum.photos/600/400?1">
<h3>Star Wars Collection</h3>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?2">
<h3>Marvel Collection</h3>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?3">
<h3>Anime Collection</h3>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?4">
<h3>Bust Collection</h3>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?5">
<h3>Current Projects</h3>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?6">
<h3>Printer Setup</h3>
</div>

</section>

<footer>
Michael Resnick • 3D Print Hobby Gallery
</footer>

</body>
</html>
